<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FALLOUT · Admin</title>
    <link rel="stylesheet" href="https://unpkg.com/netlify-cms@^2.0.0/dist/cms.css" />
</head>
<body>
    <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
    <script>
        // Configuración de Netlify CMS
        CMS.init({
            config: {
                backend: {
                    name: 'git-gateway',
                    branch: 'main',
                },
                media_folder: 'images/uploads',
                public_folder: '/images/uploads',
                collections: [
                    {
                        name: 'posts',
                        label: 'Posts',
                        folder: 'posts',
                        create: true,
                        slug: '{{slug}}',
                        fields: [
                            { name: 'title', label: 'Título', widget: 'string' },
                            { name: 'date', label: 'Fecha', widget: 'datetime', format: 'YYYY-MM-DD' },
                            { 
                                name: 'author', 
                                label: 'Autor', 
                                widget: 'select',
                                options: ['Exiliado Político', 'Juan Villarroel']
                            },
                            {
                                name: 'category',
                                label: 'Categoría',
                                widget: 'select',
                                options: ['Política', 'Cultura', 'Tecno', 'Podcast', 'Arte', 'Otros']
                            },
                            { name: 'body', label: 'Contenido', widget: 'markdown' }
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
